name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: make setup

      - name: Syntax check
        run: make check

      - name: Tests
        run: make test

      - name: Run pipeline on sample data
        run: |
          make sample
          make reset

      - name: Idempotency check (second run must insert 0 rows)
        run: |
          make run 2>&1 | tee run2.log
          grep -q "inserted=0" run2.log

      - name: Upload dashboard data
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: dashboard/data/
